
services:
  mysql-service:
    image: mysql:8.0.33
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: local
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  springboot-service:
    build:
      context: .                    # Spring Boot Dockerfile 경로
      dockerfile: Dockerfile        # Spring Boot Dockerfile 파일명
    ports:
      - "8080:8080"                 # Spring Boot 서버 포트 매핑
    depends_on:
      - mysql-service
      - python-service              # Python 서비스가 먼저 실행됨

    environment:
      - PYTHON_SERVICE_URL=http://python-service:5000 # Python 서비스의 URL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-service:3306/local
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password

  python-service:
    build:
      context: ./python-flask-app   # Python Dockerfile 경로
      dockerfile: Dockerfile-python # Python Flask Dockerfile 파일명
    ports:
      - "5001:5000"                 # 호스트의 5001 포트를 Flask 컨테이너의 5000 포트에 매핑
