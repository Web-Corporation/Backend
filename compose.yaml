services:
  springboot-service:
    build:
      context: .                    # Spring Boot Dockerfile 경로
      dockerfile: Dockerfile        # Spring Boot Dockerfile 파일명
    ports:
      - "8081:8081"                 # Spring Boot 서버 포트 매핑
    depends_on:
      - python-service              # Python 서비스가 먼저 실행됨
      - db-service

    environment:
      - PYTHON_SERVICE_URL=http://python-service:5000 # Python 서비스의 URL
      - SPRING_DATASOURCE_URL=jdbc:mysql://sketchudb.crgo2k2ykh64.ap-northeast-2.rds.amazonaws.com:3306/sketchudb # DB URL
      - SPRING_DATASOURCE_USERNAME=root # DB 사용자명
      - SPRING_DATASOURCE_PASSWORD=Dd905925! # DB 비밀번호
      - SPRING_REDIS_HOST=clustercfg.sketchublacklist.lss30k.memorydb.ap-northeast-2.amazonaws.com # Redis 호스트
      - SPRING_REDIS_PORT=6379 # Redis 포트

  python-service:
    build:
      context: ./python-flask-app   # Python Dockerfile 경로
      dockerfile: Dockerfile-python # Python Flask Dockerfile 파일명
    ports:
      - "5002:5000"                 # 호스트의 5002 포트를 Flask 컨테이너의 5000 포트에 매핑
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

